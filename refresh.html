<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обновить Planner room</title><style>body{font:16px/1.6 system-ui;background:#f4f6fc;color:#263654;max-width:560px;margin:12vh auto;padding:24px}button,a{font:inherit;border:0;border-radius:14px;padding:14px 20px;background:#346de8;color:white;display:inline-block;text-decoration:none}p{margin:24px 0}</style><h1>Planner room</h1><p>Обновляется только код этой отдельной версии. Планы, ключи и данные других приложений не удаляются.</p><button id="go">Проверить обновление</button><p id="s" role="status"></p><a href="./">Открыть Planner room</a><script>document.getElementById('go').onclick=async()=>{let s=document.getElementById('s');try{let reg=await navigator.serviceWorker.getRegistration('./');if(reg&&reg.scope===new URL('./',location.href).href)await reg.update();s.textContent='Проверка завершена. Откройте Planner room.';}catch(e){s.textContent='Нет соединения. Попробуйте при доступе к интернету.';}};</script></html>
